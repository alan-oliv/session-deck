appId: dev.alanoliv.session-deck
productName: Session Deck
directories:
  output: dist
publish:
  provider: github
  owner: alan-oliv
  repo: session-deck
files:
  - out/**
extraResources:
  - from: native/blur/build/Release/blur.node
    to: blur.node
  - from: build/icon-dark.png
    to: icon-dark.png
  - from: build/icon-purple.png
    to: icon-purple.png
mac:
  target: dir
  icon: build/icon.icns
  identity: 'YOUR_SIGNING_IDENTITY'
  hardenedRuntime: true
  artifactName: Session-Deck-${arch}.${ext}
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSAppleEventsUsageDescription: Session Deck opens your terminal to resume Claude sessions.
dmg:
  sign: true
